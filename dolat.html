<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dolat Sahu - Official Portfolio & Bio</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #0b0f19; color: #ffffff; min-height: 100vh; padding: 25px 15px 120px 15px; }
        .wrapper { max-width: 440px; margin: 0 auto; }

        /* HEADER */
        .profile-box { text-align: center; margin-bottom: 25px; }
        .avatar-ring {
            width: 110px; height: 110px; margin: 0 auto 15px auto;
            border-radius: 50%; border: 3px solid #d4af37;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
            overflow: hidden; background: #151a28;
        }
        .avatar-ring img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .user-title { color: #d4af37; font-size: 1.4rem; font-weight: 700; margin-bottom: 6px; }
        .user-sub { color: #9ca3af; font-size: 0.88rem; line-height: 1.5; padding: 0 10px; }

        /* HEADINGS */
        .sec-head {
            color: #d4af37; font-size: 1.05rem; font-weight: 600;
            margin: 28px 0 14px 0; padding-bottom: 6px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.25);
            display: flex; align-items: center; gap: 8px;
        }

        /* BIO DATA */
        .bio-card {
            background: #131927; border-radius: 14px; padding: 6px 16px;
            border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }
        .bio-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .bio-row:last-child { border-bottom: none; }
        .bio-label { color: #9ca3af; font-size: 0.88rem; }
        .bio-val { color: #ffffff; font-size: 0.92rem; font-weight: 600; text-align: right; }

        /* SERVICES */
        .services-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .service-card {
            background: #131927; padding: 16px 14px; border-radius: 12px;
            border: 1px solid rgba(212, 175, 55, 0.15); text-align: left;
        }
        .service-card i { font-size: 1.6rem; color: #d4af37; margin-bottom: 10px; display: block; }
        .service-card h4 { font-size: 0.92rem; color: #fff; font-weight: 600; margin-bottom: 4px; }
        .service-card p { font-size: 0.78rem; color: #9ca3af; line-height: 1.3; }

        /* FEATURES */
        .feature-box {
            background: #131927; border-radius: 12px; padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.08); margin-bottom: 10px;
            display: flex; align-items: center; gap: 14px;
        }
        .feature-icon {
            width: 42px; height: 42px; background: rgba(212, 175, 55, 0.1);
            border-radius: 10px; display: flex; align-items: center; justify-content: center;
            color: #d4af37; font-size: 1.2rem; flex-shrink: 0;
        }
        .feature-text h4 { font-size: 0.92rem; color: #ffffff; font-weight: 600; }
        .feature-text p { font-size: 0.78rem; color: #9ca3af; }

        /* TECH STACK */
        .tech-container { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .tech-pill {
            background: #1a2235; border: 1px solid rgba(212, 175, 55, 0.3);
            color: #d4af37; padding: 6px 14px; border-radius: 20px;
            font-size: 0.8rem; font-weight: 500; display: flex; align-items: center; gap: 6px;
        }

        /* WHATSAPP BUTTON */
        .wa-btn {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 410px; background: #25d366; color: #ffffff;
            padding: 13px; text-align: center; font-weight: 700; border-radius: 30px;
            text-decoration: none; box-shadow: 0 4px 18px rgba(37, 211, 102, 0.4);
            display: flex; justify-content: center; align-items: center; gap: 10px;
            font-size: 0.98rem; z-index: 99999;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <!-- HEADER -->
        <div class="profile-box">
            <div class="avatar-ring">
                <img id="userImg" src="https://i.ibb.co/RpVD8ts8/profile.jpg" alt="Photo">
            </div>
            <h1 class="user-title" id="userTitle">Hello, I'm Dolat Sahu Jee</h1>
            <p class="user-sub" id="userSub">I am website and app developer. Website banana hai to contact kare hamse. Thanks</p>
        </div>

        <!-- BIO DATA -->
        <div class="sec-head"><i class="fa-solid fa-address-card"></i> Personal Bio Data</div>
        <div class="bio-card" id="bioContainer"></div>

        <!-- SERVICES -->
        <div class="sec-head"><i class="fa-solid fa-laptop-code"></i> What I Can Develop For You</div>
        <div class="services-grid" id="servicesContainer"></div>

        <!-- WHY CHOOSE ME -->
        <div class="sec-head"><i class="fa-solid fa-shield-halved"></i> Why Work With Me?</div>
        <div id="featuresContainer"></div>

        <!-- TECH STACK -->
        <div class="sec-head"><i class="fa-solid fa-code"></i> Technologies & Tools</div>
        <div class="tech-container" id="techContainer"></div>
    </div>

    <!-- WHATSAPP BUTTON -->
    <a id="waButton" href="#" target="_blank" class="wa-btn">
        <i class="fab fa-whatsapp" style="font-size: 1.3rem;"></i> Contact On WhatsApp
    </a>

    <script>
        const STORAGE_KEY = 'ds_website_data_store';
        const defaultData = {
            hero: { imgUrl: 'https://i.ibb.co/RpVD8ts8/profile.jpg', title: "Hello, I'm Dolat Sahu Jee", subtext: "I am website and app developer. Website banana hai to contact kare hamse. Thanks" },
            contact: { waNumber: '917546982355', text: 'Website ya App banwane ke liye direct WhatsApp par message karein.' },
            biodata: [
                { label: 'Full Name', value: 'Dolat Kumar Sahu' },
                { label: 'Date of Birth', value: '24 / 12 / 2012' },
                { label: 'Height', value: '5.8 Feet' },
                { label: 'Blood Group', value: 'O' },
                { label: 'Education', value: 'Coding' },
                { label: 'Skills', value: 'Website & App Development' },
                { label: 'Religion / Caste', value: 'Hindu - Sahu' },
                { label: 'Marital Status', value: 'Unmarried' }
            ],
            services: [
                { icon: 'fa-solid fa-globe', title: 'Web Development', desc: 'Personal portfolio, business websites & landing pages.' },
                { icon: 'fa-solid fa-mobile-screen-button', title: 'App Development', desc: 'Fast & lightweight Android web view and native apps.' },
                { icon: 'fa-solid fa-robot', title: 'Automation & Bots', desc: 'Python script automation & Telegram bot integration.' },
                { icon: 'fa-solid fa-wand-magic-sparkles', title: 'UI/UX Redesign', desc: 'Purani website ko modern luxury dark gold look dena.' }
            ],
            features: [
                { icon: 'fa-solid fa-bolt', title: 'Super Fast Performance', desc: 'Clean code with ultra-fast page load speed.' },
                { icon: 'fa-solid fa-mobile', title: '100% Mobile Responsive', desc: 'Har mobile screen par perfect fit & high resolution UI.' },
                { icon: 'fa-solid fa-headset', title: 'Direct WhatsApp Support', desc: 'Instant resolution & 24/7 direct communication.' }
            ],
            techStack: [
                { icon: 'fa-brands fa-html5', name: 'HTML5' },
                { icon: 'fa-brands fa-css3-alt', name: 'CSS3' },
                { icon: 'fa-brands fa-js', name: 'JavaScript' },
                { icon: 'fa-brands fa-python', name: 'Python' },
                { icon: 'fa-solid fa-server', name: 'Flask Framework' },
                { icon: 'fa-brands fa-android', name: 'Android Apps' }
            ]
        };

        function renderSite() {
            let data = defaultData;
            try {
                let stored = localStorage.getItem(STORAGE_KEY);
                if (stored) data = JSON.parse(stored);
            } catch(e) {}

            // Hero Section
            if (data.hero) {
                if (data.hero.imgUrl) document.getElementById('userImg').src = data.hero.imgUrl;
                document.getElementById('userTitle').innerText = data.hero.title || '';
                document.getElementById('userSub').innerText = data.hero.subtext || '';
            }

            // Bio Data
            const bioBox = document.getElementById('bioContainer');
            bioBox.innerHTML = '';
            (data.biodata || defaultData.biodata).forEach(item => {
                bioBox.innerHTML += `<div class="bio-row"><span class="bio-label">${item.label}</span><span class="bio-val">${item.value}</span></div>`;
            });

            // Services
            const srvBox = document.getElementById('servicesContainer');
            srvBox.innerHTML = '';
            (data.services || defaultData.services).forEach(srv => {
                srvBox.innerHTML += `<div class="service-card"><i class="${srv.icon}"></i><h4>${srv.title}</h4><p>${srv.desc}</p></div>`;
            });

            // Features
            const featBox = document.getElementById('featuresContainer');
            featBox.innerHTML = '';
            (data.features || defaultData.features).forEach(ft => {
                featBox.innerHTML += `<div class="feature-box"><div class="feature-icon"><i class="${ft.icon}"></i></div><div class="feature-text"><h4>${ft.title}</h4><p>${ft.desc}</p></div></div>`;
            });

            // Tech Stack
            const techBox = document.getElementById('techContainer');
            techBox.innerHTML = '';
            (data.techStack || defaultData.techStack).forEach(t => {
                techBox.innerHTML += `<span class="tech-pill"><i class="${t.icon}"></i> ${t.name}</span>`;
            });

            // WhatsApp Button
            if (data.contact) {
                const num = data.contact.waNumber || '917546982355';
                const msg = encodeURIComponent(data.contact.text || 'Hello');
                document.getElementById('waButton').href = `https://wa.me/${num}?text=${msg}`;
            }
        }

        window.onload = renderSite;
    </script>
</body>
</html>
